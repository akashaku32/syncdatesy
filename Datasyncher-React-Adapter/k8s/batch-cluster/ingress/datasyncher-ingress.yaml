# Batch GKE cluster only — host gcp.datasyncher.com (datasyncher-batch-cluster).
# Apply with: kubectl apply -f k8s/batch-cluster/ingress/
# Do not apply these to the qa-kubernetes cluster if that cluster still uses qa-kubernetes.datasyncher.com ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: datasyncher-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "259200"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - gcp.datasyncher.com
      secretName: datasyncher-tls
  rules:
    - host: gcp.datasyncher.com
      http:
        paths:
          - path: /api/v1/
            pathType: Prefix
            backend:
              service:
                name: django-svc
                port:
                  number: 8000
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: fastapi-svc
                port:
                  number: 9090
          - path: /ws/
            pathType: Prefix
            backend:
              service:
                name: django-svc
                port:
                  number: 8000
          - path: /admin/
            pathType: Prefix
            backend:
              service:
                name: django-svc
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: 80
