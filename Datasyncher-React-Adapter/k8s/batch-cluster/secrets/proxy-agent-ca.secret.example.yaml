# Batch: Proxy Agent issuance CA (Django signs per-company agent certs).
#
# Required keys (same names as hub/server expect):
#   - ca.crt  — PEM CA certificate
#   - ca.key  — PEM CA private key (RSA)
#
# Mount: django Deployment uses k8s/batch-cluster/patches/django-proxy-agent-ca.yaml
#        → /etc/proxy-agent-ca/ca.crt and ca.key
# Env:    PROXY_AGENT_CA_CERT_PATH / PROXY_AGENT_CA_KEY_PATH in datasyncher-secrets
#
# Create or update from local PEM files (recommended; do not commit real material):
#   kubectl create secret generic proxy-agent-ca -n default \
#     --from-file=ca.crt=/path/to/ca.crt \
#     --from-file=ca.key=/path/to/ca.key \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Copy this file to proxy-agent-ca.secret.local.yaml (gitignored), replace CHANGEME, then:
#   kubectl apply -f proxy-agent-ca.secret.local.yaml
#
# Verify cluster already has it: kubectl get secret proxy-agent-ca -n default
---
apiVersion: v1
kind: Secret
metadata:
  name: proxy-agent-ca
  namespace: default
type: Opaque
stringData:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    CHANGEME_REPLACE_WITH_BATCH_PROXY_AGENT_CA_PEM
    -----END CERTIFICATE-----
  ca.key: |
    -----BEGIN PRIVATE KEY-----
    CHANGEME_REPLACE_WITH_BATCH_PROXY_AGENT_CA_KEY_PEM
    -----END PRIVATE KEY-----
