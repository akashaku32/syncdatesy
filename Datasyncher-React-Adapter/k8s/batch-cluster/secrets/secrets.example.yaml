# Copy to secrets.local.yaml (gitignored), replace CHANGEME values, then run apply-manifests.sh.
apiVersion: v1
kind: Secret
metadata:
  name: datasyncher-secrets
  namespace: default
type: Opaque
stringData:
  # Batch environment DB (datasyncher_batch); set host/user/password for your environment.
  DATABASE_URL: "postgresql://USER:CHANGEME@DB_HOST:5432/datasyncher_batch"
  FASTAPI_DATABASE_URL: "postgresql://USER:CHANGEME@DB_HOST:5432/datasyncher_batch"
  # Memorystore in datasyncher-batch (NOT QA 10.16.100.164). Run: bash k8s/batch-cluster/ensure-batch-redis.sh
  REDIS_URL: "redis://REDIS_IP:6379/0"
  CELERY_BROKER_URL: "redis://REDIS_IP:6379/0"
  CELERY_RESULT_BACKEND: "redis://REDIS_IP:6379/0"
  SECRET_KEY: "CHANGEME"
  DJANGO_SETTINGS_MODULE: "datasyncher.settings.qa"
  DEBUG: "false"
  DOMAIN: "gcp.datasyncher.com"
  FRONTEND_URL: "https://gcp.datasyncher.com"
  ALLOWED_HOSTS: "gcp.datasyncher.com,localhost,127.0.0.1,django-svc,django-svc.default.svc,django-svc.default.svc.cluster.local"
  CORS_ALLOWED_ORIGINS: "https://gcp.datasyncher.com"
  CORS_ALLOW_CREDENTIALS: "true"
  SECURE_SSL_REDIRECT: "true"
  SESSION_COOKIE_SECURE: "true"
  CSRF_COOKIE_SECURE: "true"
  SECURE_HSTS_SECONDS: "3600"
  SESSION_COOKIE_SAMESITE: "None"
  SCHEDULER_SERVICE_URL: "http://scheduler-service:5000"
  RUN_SCHEDULER: "false"
  FASTAPI_DOMAIN: "fastapi-svc:9090"
  MIGRATION_FUNCTION_INTERNAL_URL: "http://migration-function-svc:8001"
  USE_INTERNAL_MIGRATION_API: "true"
  DJANGO_INTERNAL_BASE_URL: "http://django-svc:8000"
  USE_INTERNAL_API: "true"
  CELERY_FANOUT_ENABLED: "true"
  CELERY_DIRECT_CONNECTOR_EXECUTION: "true"
  CELERY_HTTP_FALLBACK_ENABLED: "false"
  CELERY_WORKER_CONCURRENCY: "1"
  # Pipeline run-wide pod budget (shared plan max_pods across in-flight nodes).
  # Default false until validated; set true to enable proportional pod_cap dispatch.
  PIPELINE_FLOW_POD_BUDGET_ENABLED: "false"
  # One worker fleet per pipeline run (plan max pods), reused across batch levels.
  # Keep true so mid-run batches share the flow fleet and do not hit company_job_cap.
  PIPELINE_FLOW_FLEET_REUSE_ENABLED: "true"
  # Hand off each DAG step and poll; required for ~100 concurrent accounts.
  PIPELINE_NONBLOCKING_ORCHESTRATION: "true"
  # Spread scheduled starts (0..N seconds) across accounts.
  PIPELINE_SCHEDULE_JITTER_SECONDS: "300"
  SNOWFLAKE_STAGE: "SAMPLE_STAGE"
  # Batch Snowflake GCS integration (must match batch-snowflake.defaults.env + ensure-batch-snowflake-storage-integration.sql)
  SNOWFLAKE_STORAGE_INTEGRATION: "DATASYNCHERBATCH"
  GCP_PROJECT_ID: "datasyncher-batch"
  GCS_BUCKET_NAME: "meta_data_bucket_ds_batch"
  GCS_BUCKET_URL: "gcs://meta_data_bucket_ds_batch/"
  GCP_SERVICE_ACCOUNT_EMAIL: "celery-gcs-uploader@datasyncher-batch.iam.gserviceaccount.com"
  # Snowflake STORAGE_GCP_SERVICE_ACCOUNT for DATASYNCHERBATCH — GCP IAM granted by ensure-batch-gcs-bucket.sh
  SNOWFLAKE_GCS_SA: "kij800000@awsuseast2-a5c7.iam.gserviceaccount.com"
  DB_HOST: "CHANGEME"
  DB_USER: "postgres"
  DB_PASSWORD: "CHANGEME"
  DB_NAME: "datasyncher_batch"
  DB_CONNECT_TIMEOUT: "30"
  # Databricks SQL warehouse cold start (connection test + migrations); default 900s (15 min)
  DATABRICKS_WAREHOUSE_COLD_START_SECONDS: "900"
  # Django -> migration-function HTTP timeout for Databricks auth (default cold start + 60s)
  DATABRICKS_AUTH_REQUEST_TIMEOUT_SECONDS: "960"
  # Dynamics Databricks Spark MERGE poll wait (seconds); migration-function default 129600 (36h).
  DYNAMICS_DBX_SPARK_JOB_TIMEOUT_SECONDS: "129600"
  DYNAMICS_DBX_SPARK_BULK_JOB_TIMEOUT_SECONDS: "129600"
  # Per-table Celery child -> migration-function HTTP wait; must exceed Spark poll (default 133200 / 37h).
  CELERY_MIGRATION_HTTP_TIMEOUT_SECONDS: "133200"
  # Django -> migration-function timeout for Salesforce JWT/OAuth authorization
  SALESFORCE_AUTH_REQUEST_TIMEOUT_SECONDS: "120"
  DB_KEEPALIVES: "1"
  DB_KEEPALIVES_IDLE: "30"
  DB_KEEPALIVES_INTERVAL: "10"
  DB_KEEPALIVES_COUNT: "5"
  SCHEDULER_DB_URL: "postgresql://USER:CHANGEME@DB_HOST:5432/datasyncher_batch"
  EMAIL_HOST: "smtp.gmail.com"
  EMAIL_PORT: "587"
  EMAIL_USE_TLS: "True"
  EMAIL_USER: "CHANGEME"
  EMAIL_PASSWORD: "CHANGEME"
  EMAIL_HOST_USER: "CHANGEME"
  EMAIL_HOST_PASSWORD: "CHANGEME"
  DEFAULT_FROM_EMAIL: "CHANGEME"
  EMAIL_FROM_NAME: "DataSyncher"
  ERROR_NOTIFICATION_RECIPIENTS: "admin@datasyncher.com"
  INTERNAL_API_KEY: "CHANGEME"
  # Proxy agent progress (HTTPS gateway). CA paths are mounted separately.
  PROXY_AGENT_PUBLIC_API_HOST: "agent-api.gcp.datasyncher.com"
  PROXY_AGENT_PROGRESS_TRANSPORT: "grpc_with_https_fallback"
  # Hub gRPC (NOT gcp.datasyncher.com UI host). Use hub LB IP until agent-hub.gcp DNS exists.
  # gRPC hub for SAP OData proxy (migration-function client). In-cluster default is set on deployment;
  # use external LB/DNS here when hub is not on sap-proxy-agent-hub-svc.
  PROXY_AGENT_SERVER_HOST: "sap-proxy-agent-hub-svc.default.svc.cluster.local"
  PROXY_AGENT_SERVER_PORT: "50051"
  # Optional: inline PEMs if not using the mounted Secret (see migration-function Deployment).
  # PROXY_AGENT_HUB_TRUSTED_CA_PEM: "-----BEGIN CERTIFICATE-----\\n...\\n-----END CERTIFICATE-----\\n"
  # PROXY_AGENT_HUB_CLIENT_CERT_PEM: "-----BEGIN CERTIFICATE-----\\n...\\n-----END CERTIFICATE-----\\n"
  # PROXY_AGENT_HUB_CLIENT_KEY_PEM: "-----BEGIN PRIVATE KEY-----\\n...\\n-----END PRIVATE KEY-----\\n"
  # Issuance CA: Secret proxy-agent-ca (ca.crt, ca.key) — template:
  # k8s/batch-cluster/secrets/proxy-agent-ca.secret.example.yaml
  PROXY_AGENT_CA_CERT_PATH: "/etc/proxy-agent-ca/ca.crt"
  PROXY_AGENT_CA_KEY_PATH: "/etc/proxy-agent-ca/ca.key"
