# Lets celery workers read pod status + events (OOMKilled detection when assigned pod dies).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: celery-worker-pod-read
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: celery-worker-pod-read
  namespace: default
subjects:
  - kind: ServiceAccount
    name: celery-gcs
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: celery-worker-pod-read
