apiVersion: apps/v1
kind: Deployment
metadata:
  name: documentation
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: documentation
  template:
    metadata:
      labels:
        app: documentation
    spec:
      nodeSelector:
        pool: app
      containers:
        - name: documentation
          image: gcr.io/datasyncher-kubernetes/datasyncher-docs:qa
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /docs/guides/connectors/aws-s3.json
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
