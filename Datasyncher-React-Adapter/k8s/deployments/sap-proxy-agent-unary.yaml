# SAP proxy agent unary gRPC (:50053) — bootstrap token validation, GCP broker, legacy status.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sap-proxy-agent-unary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sap-proxy-agent-unary
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sap-proxy-agent-unary
    spec:
      serviceAccountName: celery-gcs
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        pool: app
      containers:
        - name: sap-proxy-agent-unary
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          image: gcr.io/datasyncher-batch/datasyncher-sap-proxy-agent-unary:batch
          imagePullPolicy: Always
          ports:
            - containerPort: 50053
              name: grpc
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: datasyncher.settings.kubernetes
            - name: UNARY_RPC_PORT
              value: "50053"
            - name: UNARY_RPC_MTLS_DIR
              value: /etc/sap-proxy-agent-unary/mtls
          envFrom:
            - secretRef:
                name: datasyncher-secrets
          volumeMounts:
            - name: unary-mtls
              mountPath: /etc/sap-proxy-agent-unary/mtls
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 50053
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50053
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: unary-mtls
          secret:
            secretName: sap-proxy-agent-hub-mtls
            optional: false
