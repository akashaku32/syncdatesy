[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:django]
command=python manage.py runserver 0.0.0.0:8000
directory=/app
user=datasyncher
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/gunicorn/django.log
environment=PATH="/usr/local/bin:/usr/bin:/bin",DJANGO_SETTINGS_MODULE="datasyncher.settings.developer"

[program:celery]
command=celery -A config worker --loglevel=debug
directory=/app
user=datasyncher
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/celery/worker.log
environment=PATH="/usr/local/bin:/usr/bin:/bin",DJANGO_SETTINGS_MODULE="datasyncher.settings.developer"

[program:celery-beat]
command=celery -A config beat --loglevel=debug
directory=/app
user=datasyncher
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/celery/beat.log
environment=PATH="/usr/local/bin:/usr/bin:/bin",DJANGO_SETTINGS_MODULE="datasyncher.settings.developer"

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx/stdout.log
stderr_logfile=/var/log/nginx/stderr.log