worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 768;
    # multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 259200;
    types_hash_max_size 2048;

    # Set timeouts to 3 days (259200 seconds)
    proxy_connect_timeout 259200s;
    proxy_send_timeout 259200s;
    proxy_read_timeout 259200s;
    send_timeout 259200s;

    # Client body size limit (for large file uploads)
    client_max_body_size 100M;

    # Gzip Compression Settings
    gzip on;
    gzip_min_length 1024;  # Compress files larger than 1KB
    gzip_comp_level 6;  # Compression level (1-9, higher is more compressed)
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xhtml+xml
        image/svg+xml
        font/woff
        font/woff2;

    # Enable Gzip for requests coming from proxies
    gzip_proxied any;

    # Enable Vary header for proxies and CDNs
    gzip_vary on;

    # Upstream definitions
    upstream frontend_app {
        server frontend:80;
    }

    upstream django_app {
        server web:8000;
    }

    upstream flask_api {
        server flask-api:8080;
    }

    upstream fast_api {
        server fast-api:9090;
    }

    upstream migration_api {
        server migration-function:8001;
    }

    # HTTP server block to redirect to HTTPS
    server {
        listen 80;
        
        # Use your domain name or IP address
        server_name localhost datasyncher.com *.datasyncher.com;
        
        # Allow access to .well-known/acme-challenge for Certbot verification
        location /.well-known/acme-challenge/ {
           root /var/www/html;  # Ensure this matches the webroot path you specified in Certbot
        }
        
        # Redirect all other HTTP traffic to HTTPS
        location / {
           return 301 https://$host$request_uri;
        }
    }

    # HTTPS server block with HTTP/2 enabled
    server {
        listen 443 ssl http2;  # Enable HTTP/2 here
        server_name localhost datasyncher.com *.datasyncher.com;

        # SSL settings
        ssl_certificate /etc/nginx/ssl/certificate.crt;
        ssl_certificate_key /etc/nginx/ssl/private.key;

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        
        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";

        # Route requests to Frontend React app (default)
        location / {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route requests to Django API
        location /api {
            proxy_pass http://django_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Route requests to Django Admin
        location /admin {
            proxy_pass http://django_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route requests to Migration Function
        location /api-new/ {
            proxy_pass http://migration_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route requests to FastAPI service
        location /fast-api/ {
            proxy_pass http://fast_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # FastAPI specific optimizations
            proxy_buffering off;
            proxy_buffer_size 16k;
            proxy_buffers 4 32k;
            proxy_busy_buffers_size 64k;
        }

        # WebSocket support for Django Channels
        location /ws/ {
            proxy_pass http://django_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static files
        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Media files
        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Health check endpoint
        location /health/ {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'healthy\n';
        }
    }
}