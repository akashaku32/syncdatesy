version: '3.8'
 
services:
  traefik:
    image: traefik:v2.11
    command:
      - "--providers.docker=true"
      - "--providers.docker.watch=true"
      - "--providers.docker.exposedbydefault=false"
      # Note: --providers.docker.network not needed since Traefik is already on datasyncher-network
      # Traefik will auto-discover services on the same network
 
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
 
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
 
      # HTTP → HTTPS redirect (IMPORTANT)
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
 
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=akash.c@spectrasoln.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
 
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--api.dashboard=true"
      - "--log.level=INFO"
 
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
 
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
      - ./deploy/traefik/dynamic:/etc/traefik/dynamic:ro
 
    networks:
      - datasyncher-network
 
    healthcheck:
      test: ["CMD", "pgrep", "traefik"]
      interval: 30s
      timeout: 5s
      retries: 3
 
 
  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    user: root
    command: >
      bash -c "
      chown -R www-data:www-data /app/staticfiles /app/media &&
      su -s /bin/bash -c 'python manage.py collectstatic --noinput &&
      gunicorn datasyncher.wsgi:application \
        --bind 0.0.0.0:8000 \
        --workers 5 \
        --threads 2 \
        --timeout 60 \
        --graceful-timeout 30 \
        --max-requests 1000 \
        --max-requests-jitter 100' www-data
      "
 
    volumes:
      - .:/app
      - staticfiles_volume:/app/staticfiles
      - media_volume:/app/media
 
    expose:
      - "8000"
 
    env_file:
      - .env.developer
 
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=datasyncher.settings.developer
      - SCHEDULER_SERVICE_URL=http://scheduler-service:5000
      - RUN_SCHEDULER=false
 
    depends_on:
      redis:
        condition: service_healthy
 
    networks:
      - datasyncher-network
 
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`qa.datasyncher.com`) && (PathPrefix(`/admin`) || PathPrefix(`/api/`) || PathPrefix(`/media`))"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls=true"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web.priority=10"
      - "traefik.http.services.web.loadbalancer.server.port=8000"
 
  web-ws:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile

    command: >
      uvicorn datasyncher.asgi:application
      --host 0.0.0.0
      --port 8002
      --workers 1
      --proxy-headers
      --ws-ping-interval 20
      --ws-ping-timeout 20
      --log-level info

    volumes:
      - .:/app
      - staticfiles_volume:/app/staticfiles
      - media_volume:/app/media

    expose:
      - "8002"

    env_file:
      - .env.developer

    environment:
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: datasyncher.settings.developer
      SCHEDULER_SERVICE_URL: http://scheduler-service:5000
      RUN_SCHEDULER: "false"

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - datasyncher-network

    labels:
      - "traefik.enable=true"

      # WebSocket routing
      - "traefik.http.routers.web-ws.rule=Host(`qa.datasyncher.com`) && PathPrefix(`/ws/`)"
      - "traefik.http.routers.web-ws.entrypoints=websecure"
      - "traefik.http.routers.web-ws.tls=true"
      - "traefik.http.routers.web-ws.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web-ws.priority=1000"
      # WebSocket service port
      - "traefik.http.services.web-ws.loadbalancer.server.port=8002"


  fast-api:
    build:
      context: ./backend/fast-api
      dockerfile: Dockerfile
    command: >
      uvicorn app:app
      --host 0.0.0.0
      --port 9090
      --workers 3
      --timeout-keep-alive 30
 
    volumes:
      - ./backend/fast-api:/app
 
    expose:
      - "9090"
 
    env_file:
      - .env.developer

    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

    depends_on:
      redis:
        condition: service_healthy
 
    networks:
      - datasyncher-network
 
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fastapi.rule=Host(`qa.datasyncher.com`) && PathPrefix(`/fast-api`)"
      - "traefik.http.routers.fastapi.entrypoints=websecure"
      - "traefik.http.routers.fastapi.tls=true"
      - "traefik.http.routers.fastapi.tls.certresolver=letsencrypt"
      - "traefik.http.services.fastapi.loadbalancer.server.port=9090"
      - "traefik.http.middlewares.fastapi-strip.stripprefix.prefixes=/fast-api"
      - "traefik.http.routers.fastapi.middlewares=fastapi-strip"
      - "traefik.http.routers.fastapi.priority=10"
 
 
  migration-function:
    build:
      context: ./backend/migration-function
      dockerfile: Dockerfile
    command: >
      uvicorn app:app
      --host 0.0.0.0
      --port 8001
      --workers 4
      --timeout-keep-alive 600
 
    volumes:
      - ./backend/migration-function:/app
 
    expose:
      - "8001"
 
    env_file:
      - ./backend/migration-function/.env
 
    depends_on:
      redis:
        condition: service_healthy
 
    networks:
      - datasyncher-network
 
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.migration.rule=Host(`qa.datasyncher.com`) && PathPrefix(`/api-new/`)"
      - "traefik.http.routers.migration.entrypoints=websecure"
      - "traefik.http.routers.migration.tls=true"
      - "traefik.http.routers.migration.tls.certresolver=letsencrypt"
      - "traefik.http.services.migration.loadbalancer.server.port=8001"
      - "traefik.http.middlewares.migration-strip.stripprefix.prefixes=/api-new"
      - "traefik.http.routers.migration.middlewares=migration-strip"
      - "traefik.http.routers.migration.priority=1000"


  static-files:
    image: nginx:alpine
    volumes:
      - staticfiles_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - ./deploy/nginx/staticfiles.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    networks:
      - datasyncher-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.static.rule=Host(`qa.datasyncher.com`) && PathPrefix(`/static/`)"
      - "traefik.http.routers.static.entrypoints=websecure"
      - "traefik.http.routers.static.tls=true"
      - "traefik.http.routers.static.tls.certresolver=letsencrypt"
      - "traefik.http.routers.static.priority=1000"
      - "traefik.http.routers.static.service=static"
      - "traefik.http.services.static.loadbalancer.server.port=80"
      - "traefik.http.routers.media.rule=Host(`qa.datasyncher.com`) && PathPrefix(`/media/`)"
      - "traefik.http.routers.media.entrypoints=websecure"
      - "traefik.http.routers.media.tls=true"
      - "traefik.http.routers.media.tls.certresolver=letsencrypt"
      - "traefik.http.routers.media.priority=1000"
      - "traefik.http.routers.media.service=media"
      - "traefik.http.services.media.loadbalancer.server.port=80"
 
 
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --tcp-keepalive 60
 
    expose:
      - "6379"
 
    networks:
      - datasyncher-network
 
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
 
  celery:
    build:
      context: ./backend/fast-api
      dockerfile: Dockerfile
    command: >
      celery -A celery_worker.celery_app worker
      --loglevel=info
      --autoscale=8,2
      --prefetch-multiplier=1
      --pool=prefork
      --uid=nobody
      --queues=default
    volumes:
      - ./backend/fast-api:/app
    env_file:
      - .env.developer
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - datasyncher-network
  celery_beat:
    build:
      context: ./backend/fast-api
      dockerfile: Dockerfile
    command: celery -A celery_worker.celery_app beat --loglevel=info
    volumes:
      - ./backend/fast-api:/app
    working_dir: /app
    env_file:
      - .env.developer
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - datasyncher-network
  celery_beat_django:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    command: >
      celery -A datasyncher.celery_app beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - .env.developer
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=datasyncher.settings.developer
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - datasyncher-network
  celery_django:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    command: >
      celery -A datasyncher.celery_app worker
      --loglevel=info
      --concurrency=4
      --max-tasks-per-child=50
      --autoscale=4,2
      --pool=prefork
    volumes:
      - .:/app
    env_file:
      - .env.developer
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - RUN_SCHEDULER=false
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - datasyncher-network
  scheduler-service:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    command: python -m apps.elttool.scheduler_service
    volumes:
      - .:/app
    env_file:
      - .env.developer
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - RUN_SCHEDULER=true
    expose:
      - "5000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - datasyncher-network

volumes:
  staticfiles_volume:
  media_volume:
  redis_data:
 
 
networks:
  datasyncher-network:
    driver: bridge

