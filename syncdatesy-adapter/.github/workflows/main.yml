name: Deploy to GCE

on:
  push:
    branches:
      - developer
      - qa
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set environment context
        id: set_env
        run: |
          if [[ "${{ github.ref_name }}" == "developer" ]]; then
            echo "ENV=DEV" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "qa" ]]; then
            echo "ENV=QA" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "production" ]]; then
            echo "ENV=PROD" >> $GITHUB_ENV
          fi

      - name: Setup SSH key
        run: |
          if [[ "$ENV" == "DEV" ]]; then
            echo "${{ secrets.GCE_SSH_PRIVATE_KEY_DEV }}" > gce_key
          elif [[ "$ENV" == "QA" ]]; then
            echo "${{ secrets.GCE_SSH_PRIVATE_KEY_QA }}" > gce_key
          elif [[ "$ENV" == "PROD" ]]; then
            echo "${{ secrets.GCE_SSH_PRIVATE_KEY_PROD }}" > gce_key
          fi
          chmod 600 gce_key

      - name: Deploy to GCE
        run: |
          if [[ "$ENV" == "DEV" ]]; then
            HOST="${{ secrets.GCE_HOST_DEV }}"
            ENV_FILE="${{ secrets.ENV_DEV }}"
          elif [[ "$ENV" == "QA" ]]; then
            HOST="${{ secrets.GCE_HOST_QA }}"
            ENV_FILE="${{ secrets.ENV_QA }}"
          elif [[ "$ENV" == "PROD" ]]; then
            HOST="${{ secrets.GCE_HOST_PROD }}"
            ENV_FILE="${{ secrets.ENV_PROD }}"
          fi
          echo "📡 Connecting to $HOST..."
          ssh -i gce_key -o StrictHostKeyChecking=no ${{ secrets.GCE_USER }}@$HOST bash <<'EOF'
            set -e
            cd /opt/datasyncher/syncdatesy-adapter
            echo "📥 Updating environment file..."
            echo "$ENV_FILE" | base64 -d > .env.$ENV
            echo "🔍 Fetching latest changes..."
            git fetch origin
            git pull origin ${{ github.ref_name }}
            echo "🔨 Rebuilding all Docker containers..."
            docker compose build
            echo "🚀 Starting containers..."
            docker compose up -d
            echo "📦 Running containers:"
            docker compose ps
          EOF
