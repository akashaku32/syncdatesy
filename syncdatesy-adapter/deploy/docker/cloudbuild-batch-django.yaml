steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --no-cache
      - -t
      - gcr.io/datasyncher-batch/datasyncher-django-app:batch
      - -f
      - deploy/docker/Dockerfile
      - .
images:
  - gcr.io/datasyncher-batch/datasyncher-django-app:batch
options:
  machineType: E2_HIGHCPU_8
timeout: 3600s
