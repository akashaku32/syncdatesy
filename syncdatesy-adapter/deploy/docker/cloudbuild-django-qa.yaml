# Build context: repository root (syncdatesy-adapter).
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/datasyncher-kubernetes/datasyncher-django-app:qa'
      - '-f'
      - 'deploy/docker/Dockerfile'
      - '.'
images:
  - 'gcr.io/datasyncher-kubernetes/datasyncher-django-app:qa'
options:
  machineType: 'E2_HIGHCPU_8'
timeout: '3600s'
