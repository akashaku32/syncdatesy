[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:gunicorn]
command=gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers 4 --threads 2 --timeout 120 --access-logfile /var/log/gunicorn/access.log --error-logfile /var/log/gunicorn/error.log
directory=/app
user=datasyncher
autostart=true
autorestart=true
redirect_stderr=true
environment=PATH="/usr/local/bin:/usr/bin:/bin",DJANGO_SETTINGS_MODULE="datasyncher.settings.production"

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx/stdout.log
stderr_logfile=/var/log/nginx/stderr.log

[program:celery]
command=celery -A config worker --loglevel=info --concurrency=4
directory=/app
user=datasyncher
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/celery/worker.log
environment=PATH="/usr/local/bin:/usr/bin:/bin",DJANGO_SETTINGS_MODULE="datasyncher.settings.production"

[program:celery-beat]
command=celery -A config beat --loglevel=info
directory=/app
user=datasyncher
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/celery/beat.log
environment=PATH="/usr/local/bin:/usr/bin:/bin",DJANGO_SETTINGS_MODULE="datasyncher.settings.production"