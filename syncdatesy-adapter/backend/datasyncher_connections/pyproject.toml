[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "datasyncher-connections"
version = "0.1.0"
description = "Shared Snowflake and Postgres connection helpers for Datasyncher"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "cryptography>=41.0.0",
    "psycopg2-binary>=2.9.0",
    "snowflake-connector-python>=3.0.0",
    "snowflake-sqlalchemy>=1.5.0",
    "databricks-sql-connector>=3.0.0",
    "SQLAlchemy>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["datasyncher_connections*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
