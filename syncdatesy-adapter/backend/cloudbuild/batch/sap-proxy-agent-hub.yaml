steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/datasyncher-batch/datasyncher-sap-proxy-agent-hub:batch
      - -f
      - sap_proxy_agent/hub/Dockerfile
      - .
images:
  - gcr.io/datasyncher-batch/datasyncher-sap-proxy-agent-hub:batch
options:
  machineType: E2_HIGHCPU_8
timeout: 1200s
