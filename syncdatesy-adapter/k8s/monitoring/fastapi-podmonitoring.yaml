# Google Managed Prometheus (GMP) — scrape FastAPI /metrics on port 9090
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: fastapi
  labels:
    app: fastapi
spec:
  selector:
    matchLabels:
      app: fastapi
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
