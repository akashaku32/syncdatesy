  StagingBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn:
      - TopicPolicy40
      - TopicPolicy43
      - TopicPolicy46
      - TopicPolicy54
      - TopicPolicy56
      - TopicPolicy58
      - TopicPolicy59
      - TopicPolicy64
      - TopicPolicy73
      - TopicPolicy78
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      NotificationConfiguration:
        TopicConfigurations:
          - Topic: !Ref Topic40
            Event: "s3:ObjectCreated:*"
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: dynamics_fo/40/
          - Topic: !Ref Topic43
            Event: "s3:ObjectCreated:*"
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: dynamics_fo/43/
          - Topic: !Ref Topic46
