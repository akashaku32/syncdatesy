  QueuePolicy40:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref Queue40
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowTopic40
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt Queue40.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:csms-topic-by-path-b9e4935f5bada7675f671054256a359a060ced1e0a0060867f6d171e35f9c96c"
  Topic40:
    Type: AWS::SNS::Topic
    DependsOn: QueuePolicy40
    Properties:
      TopicName: csms-topic-by-path-b9e4935f5bada7675f671054256a359a060ced1e0a0060867f6d171e35f9c96c
      Subscription:
        - Protocol: sqs
          Endpoint: !GetAtt Queue40.Arn
  TopicPolicy40:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref Topic40
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3Publish40
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sns:Publish
            Resource: !Ref Topic40
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:s3:::${BucketName}"
              StringEquals:
                aws:SourceAccount: !Ref "AWS::AccountId"

