AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Stack 2 of 2. DataSyncher staging bucket, bucket policy, and per-connection
  S3 notifications for account 946784146896 in us-east-2. Create the IAM stack
  first. Use the same BucketName.

Rules:
  MustBeUsEast2NewAccount:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", "us-east-2"]
        AssertDescription: Create this stack in US East (Ohio), us-east-2.
      - Assert: !Equals [!Ref "AWS::AccountId", "946784146896"]
        AssertDescription: Create this stack in account 946784146896.

Parameters:
  BucketName:
    Type: String
    Default: datasyncher-dbx-use2
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"
    ConstraintDescription: Lowercase letters, numbers, and hyphens; 3-63 characters.
    Description: Must match BucketName on the IAM stack.

