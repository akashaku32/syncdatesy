            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: dynamics_fo/54/
          - Topic: !Ref Topic56
            Event: "s3:ObjectCreated:*"
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: dynamics_fo/56/
          - Topic: !Ref Topic58
            Event: "s3:ObjectCreated:*"
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: dynamics_fo/58/
          - Topic: !Ref Topic59
            Event: "s3:ObjectCreated:*"
            Filter:
