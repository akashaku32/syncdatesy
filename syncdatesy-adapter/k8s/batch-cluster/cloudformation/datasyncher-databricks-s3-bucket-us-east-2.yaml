            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: dynamics_fo/64/
          - Topic: !Ref Topic73
            Event: "s3:ObjectCreated:*"
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: dynamics_fo/73/
          - Topic: !Ref Topic78
            Event: "s3:ObjectCreated:*"
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: dynamics_fo/78/

  StagingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StagingBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: UcReadBucketLocation
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:role/databricks-uc-s3-read"
            Action: s3:GetBucketLocation
            Resource: !Sub "arn:aws:s3:::${BucketName}"
          - Sid: UcReadListDynamicsFo
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:role/databricks-uc-s3-read"
            Action: s3:ListBucket
            Resource: !Sub "arn:aws:s3:::${BucketName}"
            Condition:
              StringLike:
                s3:prefix:
                  - dynamics_fo
                  - dynamics_fo/*
          - Sid: UcReadDynamicsFoObjects
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:role/databricks-uc-s3-read"
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: !Sub "arn:aws:s3:::${BucketName}/dynamics_fo/*"

Outputs:
  BucketName:
    Value: !Ref StagingBucket
  BucketUrl:
    Value: !Sub "s3://${StagingBucket}/"
  Region:
    Value: !Ref "AWS::Region"
  AccountId:
    Value: !Ref "AWS::AccountId"
