spec:
  template:
    spec:
      containers:
        - name: migration-function
          command:
            - uvicorn
            - app:app
            - --host
            - 0.0.0.0
            - --port
            - "8001"
            - --workers
            - "2"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8001
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
