# Batch cluster — same paths as main repo; host gcp.datasyncher.com
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: migration-api-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  tls:
    - hosts:
        - gcp.datasyncher.com
      secretName: datasyncher-tls
  rules:
    - host: gcp.datasyncher.com
      http:
        paths:
          - path: /api-new(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: migration-function-svc
                port:
                  number: 8001
