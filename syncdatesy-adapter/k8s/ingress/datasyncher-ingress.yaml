apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: datasyncher-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: nginx
    kubernetes.io/ingress.global-static-ip-name: datasyncher-qa-ip
    nginx.ingress.kubernetes.io/proxy-read-timeout: "259200"
spec:
  tls:
    - hosts:
        - qa-kubernetes.datasyncher.com
      secretName: datasyncher-tls
  rules:
    - host: qa-kubernetes.datasyncher.com
      http:
        paths:
          - path: /api/v1/
            pathType: Prefix
            backend:
              service:
                name: django-svc
                port:
                  number: 8000
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: fastapi-svc
                port:
                  number: 9090
          - path: /ws/
            pathType: Prefix
            backend:
              service:
                name: django-svc
                port:
                  number: 8000
          - path: /admin/
            pathType: Prefix
            backend:
              service:
                name: django-svc
                port:
                  number: 8000
          # Documentation site + setup-guide JSON — must be before the frontend catch-all.
          - path: /docs/
            pathType: Prefix
            backend:
              service:
                name: documentation-svc
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: 80
