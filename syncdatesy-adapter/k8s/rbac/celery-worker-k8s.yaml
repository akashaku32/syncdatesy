# Celery worker K8s API access: pod read + deployment lifecycle (per-job isolation)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: celery-worker-k8s
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: celery-worker-k8s
subjects:
  - kind: ServiceAccount
    name: celery-gcs
    namespace: default
roleRef:
  kind: Role
  name: celery-worker-k8s
  apiGroup: rbac.authorization.k8s.io
