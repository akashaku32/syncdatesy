apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker-control-reconcile
  labels:
    app: celery-worker-control-reconcile
    datasyncher.com/role: control-reconcile
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker-control-reconcile
  template:
    metadata:
      labels:
        app: celery-worker-control-reconcile
        datasyncher.com/role: control-reconcile
    spec:
      serviceAccountName: celery-gcs
      nodeSelector:
        pool: control
      terminationGracePeriodSeconds: 120
      containers:
        - name: celery
          image: gcr.io/datasyncher-batch/datasyncher-fast-api:batch
          imagePullPolicy: Always
          env:
            - name: CELERY_JOB_WORKER_IMAGE
              value: "gcr.io/datasyncher-batch/datasyncher-fast-api:batch"
            - name: CELERY_JOB_WORKER_READY_TIMEOUT
              value: "420"
            # Recover PENDING children lost during worker rollouts (e.g. prefetch hold).
            # Threshold is intentionally > KEDA scale-up window to avoid duplicate runs
            # while tasks are still waiting in the migration queue.
            - name: CELERY_PENDING_CHILD_REQUEUE_ENABLED
              value: "true"
            - name: CELERY_PENDING_CHILD_REQUEUE_AFTER_SECONDS
              value: "600"
            - name: CELERY_MAX_CHILD_REQUEUES
              value: "30"
            - name: CELERY_KEDA_ACTIVE_INFLATED_THRESHOLD
              value: "200"
            - name: CELERY_KEDA_ACTIVE_FORCE_PRUNE_LEN
              value: "500"
            - name: CELERY_KEDA_ACTIVE_PRUNE_BATCH_SIZE
              value: "1000"
            - name: CELERY_OOM_ORPHAN_REQUEUE_AFTER_SECONDS
              value: "300"
            - name: CELERY_JOB_ISOLATION_MODE
              value: "per_job"
            # Keep in sync with celery-worker-django / celery-worker-control.
            - name: PIPELINE_FLOW_FLEET_REUSE_ENABLED
              value: "true"
            - name: CELERY_WORKER_ROLE
              value: "control-reconcile"
            - name: CELERY_MIGRATION_QUEUE
              value: "migration"
            - name: CELERY_MIGRATION_CONTROL_QUEUE
              value: "migration-control-reconcile"
            - name: CELERY_MIGRATION_CONTROL_ORCHESTRATE_QUEUE
              value: "migration-control"
            - name: CELERY_MIGRATION_CONTROL_RECONCILE_QUEUE
              value: "migration-control-reconcile"
            - name: CELERY_ORCHESTRATE_TASK_PRIORITY
              value: "0"
            - name: CELERY_CHECK_JOB_STATUS_PRIORITY
              value: "9"
            - name: CELERY_K8S_POD_STATUS_ENABLED
              value: "true"
            - name: CELERY_K8S_NAMESPACE
              value: "default"
            - name: CELERY_RECONCILE_MAX_SECONDS
              value: "45"
            - name: CELERY_BROKER_VISIBILITY_TIMEOUT_SECONDS
              value: "2592000"
            - name: CELERY_CLUSTER_MAX_JOB_WORKER_PODS
              value: "200"
            - name: CELERY_CLUSTER_MAX_JOB_WORKER_PODS_PER_POOL
              value: "100"
            - name: CELERY_CLUSTER_MAX_JOB_WORKER_PODS_POOL_STANDARD
              value: "100"
            - name: CELERY_CLUSTER_MAX_JOB_WORKER_PODS_POOL_PREMIUM
              value: "50"
            - name: CELERY_CLUSTER_MAX_JOB_WORKER_PODS_POOL_ENTERPRISE
              value: "50"
            - name: CELERY_PROVISION_RATE_PER_MINUTE
              value: "60"
            - name: CELERY_COMPANY_PROVISION_RATE_PER_MINUTE
              value: "6"
            - name: CELERY_STARTED_CHILD_REQUEUE_ENABLED
              value: "true"
            # Backstop: fail STARTED children orphaned past this even if requeue can't recover them.
            - name: CELERY_STARTED_CHILD_HARD_FAIL_AFTER_SECONDS
              value: "43200"
            - name: CELERY_STARTED_HARD_FAIL_REQUIRE_DEAD_POD
              value: "true"
            - name: CELERY_CHECK_JOB_STATUS_SOFT_TIME_LIMIT
              value: "90"
            - name: CELERY_CHECK_JOB_STATUS_TIME_LIMIT
              value: "120"
            - name: CELERY_STALE_TASK_SCAN_MAX_KEYS
              value: "250"
            - name: CELERY_FINALIZER_ORPHAN_CHECKS_PER_JOB
              value: "8"
            - name: CELERY_CHECK_JOB_STATUS_INTERVAL
              value: "20"
            - name: CELERY_FINALIZER_SOFT_TIME_LIMIT_SECONDS
              value: "120"
            - name: CELERY_FINALIZER_TIME_LIMIT_SECONDS
              value: "180"
            - name: CELERY_FINALIZER_MAX_ATTEMPTS
              value: "3"
            - name: CELERY_WORKER_CONCURRENCY
              value: "2"
            - name: CELERY_SCALE_DOWN_PROTECTION_ENABLED
              value: "false"
            - name: CELERY_PROMETHEUS_METRICS_ENABLED
              value: "true"
            - name: CELERY_METRICS_PORT
              value: "9101"
          ports:
            - name: metrics
              containerPort: 9101
          command:
            - celery
            - -A
            - celery_worker.celery_app
            - worker
            - --loglevel=info
            - --concurrency=2
            - --pool=prefork
            - -Q
            - migration-control-reconcile
            - -Ofair
            - --without-gossip
            - --without-mingle
          envFrom:
            - secretRef:
                name: datasyncher-secrets
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
