apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker-django-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker-django-ops
  template:
    metadata:
      labels:
        app: celery-worker-django-ops
    spec:
      nodeSelector:
        pool: app
      containers:
        - name: celery-worker-django-ops
          image: gcr.io/datasyncher-kubernetes/datasyncher-django-app:qa
          imagePullPolicy: Always
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              # Ops snapshots and reapers. Isolated from the pipeline queue so
              # monitoring backlog cannot delay organisation flow starts.
              celery -A datasyncher.celery_app worker \
                --loglevel=info \
                --concurrency="${PIPELINE_OPS_CONCURRENCY:-2}" \
                --pool=prefork \
                --prefetch-multiplier=1 \
                --max-tasks-per-child=50 \
                -Q ops,default \
                -n ops@%h
          envFrom:
            - secretRef:
                name: datasyncher-secrets
          env:
            - name: CELERY_BROKER_VISIBILITY_TIMEOUT_SECONDS
              value: "3600"
            - name: PIPELINE_OPS_CONCURRENCY
              value: "2"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
