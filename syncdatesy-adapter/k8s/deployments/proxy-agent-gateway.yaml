apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-agent-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy-agent-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: proxy-agent-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        pool: app
      containers:
        - name: proxy-agent-gateway
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          image: gcr.io/datasyncher-batch/datasyncher-proxy-agent-gateway:batch
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DJANGO_INTERNAL_BASE_URL
              value: "http://django-svc:8000"
            - name: PROXY_AGENT_GATEWAY_RATE_LIMIT
              value: "300"
          envFrom:
            - secretRef:
                name: datasyncher-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
