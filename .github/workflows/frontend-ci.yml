name: Frontend CI

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "frontend/data-syncher-ui/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/data-syncher-ui/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend/data-syncher-ui

jobs:
  lint-and-build:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/data-syncher-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (public marketing & auth shell)
        run: >
          npx eslint
          "src/pages/website"
          "src/components/website"
          "src/layouts/AuthLayout.tsx"
          "src/layouts/WebsiteLayout.tsx"
          "src/components/ui/AuthContainer.tsx"
          "src/components/auth/AuthFormCard.tsx"
          "src/components/auth/AuthMarketingPanel.tsx"
          "src/constants/home-content.ts"
          "src/constants/marketing-connectors.ts"
          "src/constants/marketing-visual.ts"

      - name: Build
        env:
          CI: true
        run: npm run build
